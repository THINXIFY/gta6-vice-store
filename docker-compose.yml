# One client's store: the app plus PostgreSQL (WL-6). See docs/deploy.md.
#
#   1. Copy .env.example to .env.production and fill it in (no NEXT_PUBLIC_* needed there:
#      set SITE_URL below or in your shell).
#   2. SITE_URL=https://www.example-store.com docker compose up -d --build
#
# Put a TLS-terminating proxy (Caddy, nginx, your host's load balancer) in front of port 3000 and
# set TRUST_PROXY=1 in .env.production so client IPs are read from X-Forwarded-For.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL, e.g. https://www.example-store.com}
        NEXT_PUBLIC_INDEXABLE: ${INDEXABLE:-}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://store:${POSTGRES_PASSWORD}@db:5432/store
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
